[config]

# Documentation for this use case can be found at
# https://metplus.readthedocs.io/en/latest/generated/met_tool_wrapper/TCRMW/TCRMW.html

# For additional information, please see the METplus Users Guide.
# https://metplus.readthedocs.io/en/latest/Users_Guide

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

PROCESS_LIST = TCRMW


###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {{start_date}}
INIT_END = {{start_date}}
MODEL = {{model}}
LEAD_SEQ = begin_end_incr(0, {{fcst_len_hrs}}, {{output_inc_hr}})
###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

INPUT_BASE = {{input_dir}}
OUTPUT_BASE = {{output_dir}}

TC_RMW_DECK_INPUT_DIR = {INPUT_BASE}
TC_RMW_DECK_TEMPLATE = {{adeck_template}}

TC_RMW_INPUT_DIR = {{vx_fcst_input_basedir}}
TC_RMW_INPUT_TEMPLATE = {{fcst_fn_template}}

TC_RMW_OUTPUT_DIR = {OUTPUT_BASE}
TC_RMW_OUTPUT_TEMPLATE = tc_rmw_aal14{date?fmt=%Y}.nc


###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

BOTH_VAR1_NAME = PRMSL
BOTH_VAR1_LEVELS = L0

BOTH_VAR2_NAME = TMP
BOTH_VAR2_LEVELS = P1000, P900, P800, P700, P500, P100

###
# TCRMW Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#tcrmw
###

METPLUS_CONF = {TC_RMW_OUTPUT_DIR}/metplus_final.{{start_date}}.TCRMW.conf
LOG_TC_RMW_VERBOSITY = {{log_met_verbosity}}
LOG_LEVEL = {{log_level}}
LOG_METPLUS = {LOG_DIR}/metplus.{{start_date}}.TCRMW.log

TC_RMW_CONFIG_FILE = {PARM_BASE}/met_config/TCRMWConfig_wrapped


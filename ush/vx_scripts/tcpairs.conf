[config]

# Documentation for this use case can be found at
# https://metplus.readthedocs.io/en/latest/generated/model_applications/tc_and_extra_tc/TCPairs_TCStat_fcstADECK_obsBDECK_ATCF_BasicExample.html

# For additional information, please see the METplus Users Guide.
# https://metplus.readthedocs.io/en/latest/Users_Guide

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

PROCESS_LIST = TCPairs


###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {ENV[START_DATE]}
INIT_END = {ENV[END_DATE]}
INIT_INCREMENT = {ENV[INC]}

###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

# TCPairs

INPUT_BASE = {ENV[INPUT_DIR]}
OUTPUT_BASE = {ENV[OUTPUT_DIR]}

TC_PAIRS_ADECK_INPUT_DIR = {INPUT_BASE}
TC_PAIRS_BDECK_INPUT_DIR = {ENV[BEST_TRACK]}

TC_PAIRS_ADECK_TEMPLATE = {ENV[ADECK_TEMPLATE]}
TC_PAIRS_BDECK_TEMPLATE = b{basin}{cyclone}{init?fmt=%Y}.dat
TC_PAIRS_READ_ALL_FILES = no

TC_PAIRS_OUTPUT_DIR = {OUTPUT_BASE}/tcpairs
TC_PAIRS_OUTPUT_TEMPLATE = tc_pairs.{MODEL}.{basin}{cyclone}{init?fmt=%Y}

LOG_MET_VERBOSITY = {ENV[LOG_MET_VERBOSITY]}
LOG_LEVEL = {ENV[LOG_LEVEL]}
###
# TCPairs Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#tcpairs
###

MODEL = {ENV[MODEL]}

TC_PAIRS_BASIN = {ENV[BASIN]}
TC_PAIRS_CYCLONE = {ENV[STORM_ID]}

TC_PAIRS_DLAND_FILE = MET_BASE/tc_data/dland_global_tenth_degree.nc

TC_PAIRS_MATCH_POINTS = TRUE
